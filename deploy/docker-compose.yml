# Cronbell on one small server: the Cronbell container behind Caddy, which gets and renews the
# HTTPS certificate. Copy this directory to the server, fill in .env (see .env.example) and run
#
#   docker compose up -d
#
# Step by step: docs/self-hosting.md.

name: cronbell

services:
  cronbell:
    image: ghcr.io/steelreed/cronbell:${CRONBELL_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # Caddy terminates TLS. Trusting its X-Forwarded-* headers gives Cronbell the client's
      # address and scheme, so session cookies are Secure. Safe because port 8080 is not
      # published: Caddy is the only way in.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      CRONBELL_BASE_URL: https://${CRONBELL_DOMAIN:?set CRONBELL_DOMAIN in .env}
      # Heap at most 60 % of the container limit; restart instead of limping on after an OOM.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError
    volumes:
      - cronbell-data:/data
    expose:
      - "8080"
    mem_limit: 512m
    # The image has no curl or wget; bash can open a TCP connection itself.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - cronbell
    environment:
      CRONBELL_DOMAIN: ${CRONBELL_DOMAIN:?set CRONBELL_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    logging: *logging

volumes:
  cronbell-data:
  caddy_data:
  caddy_config:
