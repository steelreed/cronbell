<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/cronbell.svg" />
    <title>Cronbell</title>
    <script>
      // Dark by default; a saved choice wins. Runs before paint to avoid a flash.
      try {
        const theme = localStorage.getItem("cronbell.theme");
        if (
          theme === "light" ||
          (theme === "system" && matchMedia("(prefers-color-scheme: light)").matches)
        ) {
          document.documentElement.classList.remove("dark");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
