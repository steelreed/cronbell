spring.application.name=cronbell-server
spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true

# Database: SQLite in the data directory unless CRONBELL_DATABASE_URL (PostgreSQL) or
# spring.datasource.url is set. See README.md.
cronbell.data-dir=${CRONBELL_DATA_DIR:./data}
spring.datasource.url=jdbc:sqlite:${cronbell.data-dir}/cronbell.db
spring.flyway.locations=classpath:db/migration

# Bootstrap API key for the Default project, used only on first start.
cronbell.bootstrap.api-key=${CRONBELL_API_KEY:}
# Admin account created on first start when no account exists. Unset: one-time setup page.
cronbell.bootstrap.admin-email=${CRONBELL_ADMIN_EMAIL:}
cronbell.bootstrap.admin-password=${CRONBELL_ADMIN_PASSWORD:}

# Browser sessions (DESIGN.md §6). The cookie is Secure when the request is HTTPS, including
# behind a proxy when forwarded headers are trusted (SERVER_FORWARD_HEADERS_STRATEGY=native).
server.servlet.session.cookie.name=cronbell_session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=${CRONBELL_SESSION_TIMEOUT:7d}
server.servlet.session.tracking-modes=cookie

cronbell.detector.interval=PT15S
cronbell.ping.rate-limit-per-second=5

# Public address of this server, for links in alerts (DESIGN.md §8). Unset: no link.
cronbell.base-url=${CRONBELL_BASE_URL:}

# Alerts. SMTP is used by email channels; without a host they cannot be created.
cronbell.smtp.host=${CRONBELL_SMTP_HOST:}
cronbell.smtp.port=${CRONBELL_SMTP_PORT:587}
cronbell.smtp.username=${CRONBELL_SMTP_USERNAME:}
cronbell.smtp.password=${CRONBELL_SMTP_PASSWORD:}
cronbell.smtp.from=${CRONBELL_SMTP_FROM:}
cronbell.smtp.starttls=${CRONBELL_SMTP_STARTTLS:true}
cronbell.notifier.interval=PT5S
cronbell.notifier.connect-timeout=PT5S
cronbell.notifier.read-timeout=PT10S
cronbell.notifier.telegram-api-url=https://api.telegram.org

management.endpoints.web.exposure.include=health

# OpenAPI description of the management API, public so clients and SDKs can read it.
springdoc.api-docs.path=/api/v1/openapi.json
springdoc.paths-to-match=/api/v1/**
