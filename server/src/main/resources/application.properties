spring.application.name=cron-server
spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true

# Database: SQLite in the data directory unless CRON_DATABASE_URL (PostgreSQL) or
# spring.datasource.url is set. See README.md.
cron.data-dir=${CRON_DATA_DIR:./data}
spring.datasource.url=jdbc:sqlite:${cron.data-dir}/cron.db
spring.flyway.locations=classpath:db/migration

# Bootstrap API key for the Default project, used only on first start.
cron.bootstrap.api-key=${CRON_API_KEY:}

cron.detector.interval=PT15S
cron.ping.rate-limit-per-second=5

management.endpoints.web.exposure.include=health
