version: 2
updates:
  - package-ecosystem: maven
    directory: /server
    schedule: { interval: weekly }
    groups:
      maven: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
