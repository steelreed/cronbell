name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Create a check with cron `0 2 * * *` in Asia/Ho_Chi_Minh\n2. ..."
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Cronbell version or image tag
    validations: { required: true }
  - type: dropdown
    id: database
    attributes:
      label: Database
      options: [SQLite (default), PostgreSQL]
  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: Remove API keys, ping keys and tokens first.
      render: text
